[package]
name = "screenr"
version = "0.2.0"
edition = "2021"
description = "Sleek macOS-style Phone Mirroring & System Tray Hub for Pixel 10 on Linux"

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "x11",
] }
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrcode = "0.14"
rand = "0.8"
dirs = "6.0"
chrono = "0.4"
ksni = "0.2"
x11rb = "0.13"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
